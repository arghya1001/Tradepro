name: Update Nifty data
on:
  schedule:
    - cron: "30 13 * * 1-5"   # 19:00 IST Mon-Fri (NSE official files are out by then)
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get previous data (if any)
        run: |
          git clone --depth 1 --branch data "https://github.com/${{ github.repository }}.git" _out || mkdir _out
          rm -rf _out/.git
      - name: Fetch candles
        run: OUT_DIR="$PWD/_out" python scripts/fetch_nifty.py
      - name: Publish to the data branch (single commit, keeps the repo small)
        run: |
          cd _out
          git init -q -b data
          git config user.name "tradepro-bot"
          git config user.email "tradepro-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Nifty data $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
